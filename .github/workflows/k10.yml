name: K10 Signal Bot

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r k10-signal-bot/requirements.txt

      - name: Rodar K10 Scanner
        env:
          BOT_TOKEN: ${{ secrets.TG_TOKEN }}
          ALLOWED_CHAT_IDS: ${{ secrets.TG_CHATID }}
        run: |
          cd k10-signal-bot
          python runner.py
